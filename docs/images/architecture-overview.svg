  <line x1="656" y1="397" x2="664" y2="397" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#s)"/>
  <rect x="664" y="382" width="88" height="30" rx="5" fill="#F5F9FE" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="708" y="397" text-anchor="middle" font-size="11" fill="#042C53">HyDE</text>
  <line x1="752" y1="397" x2="760" y2="397" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#s)"/>
  <rect x="760" y="382" width="88" height="30" rx="5" fill="#F5F9FE" stroke="#85B7EB" stroke-width="0.5"/>
