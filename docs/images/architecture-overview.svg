<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#0C447C">履约知识助手 Warehouse-KB 系统架构</text>

  <!-- 前端层 -->
  <rect x="20" y="60" width="860" height="92" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
  <text x="450" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">前端层 (Frontend Layer)</text>
  <rect x="60" y="96" width="380" height="42" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
  <text x="250" y="122" text-anchor="middle" font-size="13" fill="#042C53">导入界面 · import.html</text>
  <rect x="460" y="96" width="380" height="42" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
  <text x="650" y="122" text-anchor="middle" font-size="13" fill="#042C53">聊天界面 · chat.html</text>
  <line x1="250" y1="138" x2="250" y2="170" stroke="#185FA5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="138" x2="650" y2="170" stroke="#185FA5" stroke-width="2" marker-end="url(#a)"/>

  <!-- API 层 -->
  <rect x="20" y="172" width="860" height="118" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
