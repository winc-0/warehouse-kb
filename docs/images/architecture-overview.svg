  <line x1="140" y1="443" x2="148" y2="443" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#s)"/>
  <rect x="148" y="428" width="88" height="30" rx="5" fill="#F5F9FE" stroke="#85B7EB" stroke-width="0.5"/>
