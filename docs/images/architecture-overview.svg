  <path d="M804,412 V419 H516 V426" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#s)"/>
  <rect x="472" y="428" width="88" height="30" rx="5" fill="#F5F9FE" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="516" y="443" text-anchor="middle" font-size="11" fill="#042C53">RRF融合</text>
  <line x1="560" y1="443" x2="568" y2="443" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#s)"/>
  <rect x="568" y="428" width="88" height="30" rx="5" fill="#F5F9FE" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="612" y="443" text-anchor="middle" font-size="11" fill="#042C53">Rerank重排</text>
  <line x1="656" y1="443" x2="664" y2="443" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#s)"/>
  <rect x="664" y="428" width="88" height="30" rx="5" fill="#F5F9FE" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="708" y="443" text-anchor="middle" font-size="11" fill="#042C53">答案输出</text>
  <text x="812" y="419" font-size="10" fill="#888780">三路并行</text>

  <line x1="250" y1="488" x2="250" y2="514" stroke="#185FA5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="488" x2="650" y2="514" stroke="#185FA5" stroke-width="2" marker-end="url(#a)"/>

