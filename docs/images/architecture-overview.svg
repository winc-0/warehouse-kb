  <rect x="468" y="552" width="196" height="46" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
  <text x="566" y="570" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53">Reranker Utils</text>
  <text x="566" y="588" text-anchor="middle" font-size="10.5" fill="#185FA5">重排序模型</text>
  <rect x="676" y="552" width="196" height="46" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
  <text x="774" y="570" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53">LLM Utils</text>
  <text x="774" y="588" text-anchor="middle" font-size="10.5" fill="#185FA5">大模型客户端</text>
  <rect x="52" y="610" width="264" height="46" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
  <text x="184" y="628" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53">Mongo Utils</text>
  <text x="184" y="646" text-anchor="middle" font-size="10.5" fill="#185FA5">历史记录管理</text>
  <rect x="328" y="610" width="264" height="46" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
  <text x="460" y="628" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53">MinIO Utils</text>
  <text x="460" y="646" text-anchor="middle" font-size="10.5" fill="#185FA5">对象存储</text>
  <rect x="604" y="610" width="264" height="46" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
  <text x="736" y="628" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53">Task Utils</text>
  <text x="736" y="646" text-anchor="middle" font-size="10.5" fill="#185FA5">任务状态管理</text>

  <line x1="450" y1="664" x2="450" y2="688" stroke="#185FA5" stroke-width="2" marker-end="url(#a)"/>

  <!-- 数据层 -->
  <rect x="20" y="690" width="860" height="90" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
  <text x="450" y="712" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">数据层</text>
  <rect x="52" y="726" width="264" height="42" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
  <text x="184" y="743" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53">Milvus</text>
  <text x="184" y="760" text-anchor="middle" font-size="10.5" fill="#185FA5">向量数据库</text>
  <rect x="328" y="726" width="264" height="42" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
  <text x="460" y="743" text-anchor="middle" font-size="12" font-weight="600" fill="#042C53">MongoDB</text>
  <text x="460" y="760" text-anchor="middle" font-size="10.5" fill="#185FA5">文档数据库</text>
  <rect x="604" y="726" width="264" height="42" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
