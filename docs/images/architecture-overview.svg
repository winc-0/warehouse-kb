  <rect x="60" y="208" width="380" height="64" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
  <text x="250" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53">导入服务 :8000 · import_service.py</text>
  <text x="250" y="252" text-anchor="middle" font-size="11" fill="#185FA5">POST /upload　　GET /status/{task_id}</text>
  <rect x="460" y="208" width="380" height="64" rx="6" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.75"/>
  <text x="650" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53">查询服务 :8001 · query_service.py</text>
  <text x="650" y="252" text-anchor="middle" font-size="11" fill="#185FA5">POST /query　GET /stream/{session_id}　GET /history/{session_id}</text>
  <line x1="250" y1="290" x2="250" y2="316" stroke="#185FA5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="290" x2="650" y2="316" stroke="#185FA5" stroke-width="2" marker-end="url(#a)"/>

