[project]
name = "zhiyuan"
version = "0.1.0"
description = "履约知识助手 Warehouse-KB：基于 LangGraph 的企业级 RAG 智能知识库（三路混合召回 + RRF 融合 + 重排）"
# 1. 限制 Python 版本范围，匹配当前 PyTorch 官方支持的 Python 环境
requires-python = ">=3.11,<3.13"
# 依赖已按「实际 import 过」核对过一遍，移除了未实际引用的占位包。
# 其中 logging / logger / path 属于 PyPI 上的同名占位包，安装后会覆盖标准库同名模块，
# 属于必须移除的一类；myapplication / state / sections / datatype / hybrid-search
# 为未实际引用的占位依赖，全仓 0 引用。
dependencies = [
    # --- 服务与基础设施 ---
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.52.4",
    "colorlog>=6.10.1",
    "python-dotenv>=1.2.2",
    # 联网搜索节点直接依赖 httpx 调用百炼 MCP，显式声明避免随上游包变动而缺失
    "httpx>=0.28.1",
    # --- 编排与模型 ---
    "langchain>=1.2.16",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.1.10",
    "dashscope>=1.27.5",
    # --- 存储与检索 ---
    "minio>=7.2.20",
    "pymongo>=4.17.0",
    "pymilvus[model]>=3.0.1",
    # --- 本地向量化（BGE-M3，GPU 可选）---
    "numpy>=2.4.4",
    "torch>=2.0.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "modelscope>=1.39.1",
]

[tool.uv.sources]
# 显式锁定 Torch 使用专用的 CUDA 12.4 源（CPU 环境可改为官方 PyPI 源）
torch = { index = "pytorch-cuda" }

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true


[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
